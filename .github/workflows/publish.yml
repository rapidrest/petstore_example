name: CI

on:
  push:
    branches: [ master ]
    tags:
      - "*"
  workflow_run:
    workflows: ["build"]
    types:
      - completed

jobs:
  publish-docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment: publish
    container:
      image: docker:git
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
          -u ${{ github.actor }} \
          --password-stdin

      - name: Build image
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          docker build -t $IMAGE_NAME:latest .

      - name: Push images
        env:
          REGISTRY: ${{ secrets.NEXUS_REGISTRY }}
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          TAG=${GITHUB_REF#refs/tags/}

          docker push $IMAGE_NAME:latest
          docker tag $IMAGE_NAME:latest $IMAGE_NAME:$TAG
          docker push $IMAGE_NAME:$TAG

      - name: Make package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            /user/packages/container/${{ github.event.repository.name }}/visibility \
            -f visibility=public

  publish-helm-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment: publish
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Update dependencies
        run: |
          helm dep up ./helm

      - name: Package chart
        run: |
          helm package ./helm \
            --version "${GITHUB_REF_NAME}" \
            --app-version "${GITHUB_REF_NAME}"

      - name: Push chart to GHCR
        run: |
          CHART_VERSION="${GITHUB_REF_NAME}"
          CHART_NAME=$(helm show chart ./helm | yq '.name')
          helm push "${CHART_NAME}-${CHART_VERSION}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"

      - name: Make chart public
        run: |
          CHART_NAME=$(helm show chart ./helm | yq '.name')
          PACKAGE_URL="https://api.github.com/orgs/${{ github.repository_owner }}/packages/container/${CHART_NAME}/visibility"

          curl -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "$PACKAGE_URL" \
            -d '{"visibility":"public"}'
