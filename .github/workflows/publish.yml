name: CI

on:
  push:
    branches: [ master ]
    tags:
      - "*"
  workflow_run:
    workflows: ["build"]
    types:
      - completed

jobs:
  publish-docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment: publish
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Extract package name
        id: pkg
        run: |
          echo "name=$(yq '.name' package.json)" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
          -u ${{ github.actor }} \
          --password-stdin

      - name: Build image
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/${{ steps.pkg.outputs.name }}
          docker build -t $IMAGE_NAME:latest .

      - name: Push images
        env:
          REGISTRY: ${{ secrets.NEXUS_REGISTRY }}
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/${{ steps.pkg.outputs.name }}
          TAG=${GITHUB_REF#refs/tags/v}

          docker push $IMAGE_NAME:latest
          docker tag $IMAGE_NAME:latest $IMAGE_NAME:$TAG
          docker push $IMAGE_NAME:$TAG

      - name: Make package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/orgs/${{ github.repository_owner }}/packages/container/${{ steps.pkg.outputs.name }}/visibility" \
            -d '{"visibility":"public"}'

  publish-helm-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment: publish
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Extract chart name
        id: pkg
        run: |
          echo "name=$(yq '.name' ./helm/Chart.yaml)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Add helm repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Update dependencies
        run: |
          helm dep up ./helm

      - name: Package chart
        run: |
          helm package ./helm \
            --version "${GITHUB_REF#refs/tags/v}" \
            --app-version "${GITHUB_REF#refs/tags/v}"

      - name: Push chart to GHCR
        run: |
          CHART_NAME="${{ steps.pkg.outputs.name }}"
          CHART_VERSION="${GITHUB_REF#refs/tags/v}"
          helm push "./helm/${CHART_NAME}-${CHART_VERSION}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"

      - name: Make chart public
        run: |
          curl -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/orgs/${{ github.repository_owner }}/packages/helm/${{ steps.pkg.outputs.name }}/visibility" \
            -d '{"visibility":"public"}'
