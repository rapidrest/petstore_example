apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: api-gateway
spec:
  gatewayClassName: nginx
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
  {{- if $.Values.gateway.tls }}
  - name: https
    protocol: HTTPS
    port: 443
    hostname: {{ $.Values.host | quote }}
    tls:
      mode: Terminate
      {{- if and (ne $.Values.host "localhost") (not (contains ".local" $.Values.host)) }}
      certificateRefs:
      - name: {{ $.Values.host }}-tls-cert
        kind: Secret
      {{- end }}
  {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-httproute
spec:
  parentRefs:
  - name: api-gateway
    sectionName: http
  hostnames:
  - {{ $.Values.host | quote }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: petstore-services
      port: 80