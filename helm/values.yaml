domain: company.local
host: localhost
environment: dev
auth:
  audience: '{{ .Values.domain }}'
  issuer: api.{{ .Values.domain }}
  expiresIn: 1 hour
  secret: '{{ randAlphaNum 32 }}'
cookies:
  secret: '{{ randAlphaNum 32 }}'
sessions:
  secret: '{{ randAlphaNum 32 }}'
common:
  storageClass: default
  logs:
    level: info
ingress:
  hsts: true
  tls: true
redis:
  create: true
  url: redis://db-redis-master
  architecture: standalone
  auth:
    enabled: false
  fullnameOverride: db-redis
  usePassword: false
  master:
    persistence:
      enabled: false
  replica:
    persistence:
      enabled: false
  networkPolicy:
    enabled: true
    allowExternal: false
mongodb:
  create: true
  # url: <url>
  architecture: standalone
  fullnameOverride: mongodb
  auth:
    enabled: false
    # username: <username>
    # password: <password>
service:
  image:
    registry: ghcr.io
    repository: rapidrest/petstore
    tag: 1.0.23-cjs
  replicas: 1
  mongodb:
    acl:
      name: access_control_lists
      host: ''
    mongo:
      name: petstore
      fullnameOverride: ''
      host: ''
  config:
    logs: true
    metrics: true
    releaseNotes: true
